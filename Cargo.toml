[workspace]
resolver = "3"
members = ["crates/core", "crates/codegen", "crates/store", "crates/server", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ishaanrajiv/trail"

# The whole runtime dependency list. scripts/check fails if a crate uses anything else:
# Trail is meant to stay small, so a new dependency is a decision, not a convenience.
[workspace.dependencies]
trail-core = { path = "crates/core" }
trail-codegen = { path = "crates/codegen" }
trail-store = { path = "crates/store" }
trail-server = { path = "crates/server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
parquet = { version = "60", default-features = false, features = ["zstd"] }
tiny_http = "0.12"
ureq = { version = "3", default-features = false }
jiff = "0.2"
getrandom = "0.4"
lexopt = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
